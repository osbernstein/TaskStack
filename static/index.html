<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskStack</title>
  <style>
    /* Default theme: Blue (Light monochromatic palette) */
    :root {
      --bg-outer: #bae6fd;
      --bg-inner: #e0f2fe;
      --circle-glow: #e0f2fe;
      --circle-core: #ffffff;
      --circle-border: rgba(2, 132, 199, 0.25);
      --text: #0369a1;
      --text-muted: #0284c7;
      --card-bg: rgba(255, 255, 255, 0.82);
      --card-border: rgba(186, 230, 253, 0.9);
      --input-bg: rgba(255, 255, 255, 0.95);
      --accent: #0284c7;
    }

    [data-theme="red"] {
      --bg-outer: #fecdd3;
      --bg-inner: #ffe4e6;
      --circle-glow: #ffe4e6;
      --circle-core: #ffffff;
      --circle-border: rgba(225, 29, 72, 0.2);
      --text: #be123c;
      --text-muted: #e11d48;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(254, 205, 211, 0.9);
      --accent: #e11d48;
    }

    [data-theme="orange"] {
      --bg-outer: #fed7aa;
      --bg-inner: #ffedd5;
      --circle-glow: #ffedd5;
      --circle-core: #ffffff;
      --circle-border: rgba(234, 88, 12, 0.2);
      --text: #c2410c;
      --text-muted: #ea580c;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(254, 215, 170, 0.9);
      --accent: #ea580c;
    }

    [data-theme="yellow"] {
      --bg-outer: #fef08a;
      --bg-inner: #fef9c3;
      --circle-glow: #fefce8;
      --circle-core: #ffffff;
      --circle-border: rgba(202, 138, 4, 0.25);
      --text: #a16207;
      --text-muted: #ca8a04;
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(254, 240, 138, 0.9);
      --accent: #ca8a04;
    }

    [data-theme="green"] {
      --bg-outer: #bbf7d0;
      --bg-inner: #dcfce7;
      --circle-glow: #f0fdf4;
      --circle-core: #ffffff;
      --circle-border: rgba(22, 163, 74, 0.2);
      --text: #15803d;
      --text-muted: #16a34a;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(187, 247, 208, 0.9);
      --accent: #16a34a;
    }

    [data-theme="indigo"] {
      --bg-outer: #c7d2fe;
      --bg-inner: #e0e7ff;
      --circle-glow: #eef2ff;
      --circle-core: #ffffff;
      --circle-border: rgba(79, 70, 229, 0.2);
      --text: #4338ca;
      --text-muted: #4f46e5;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(199, 210, 254, 0.9);
      --accent: #4f46e5;
    }

    [data-theme="violet"] {
      --bg-outer: #ddd6fe;
      --bg-inner: #ede9fe;
      --circle-glow: #f5f3ff;
      --circle-core: #ffffff;
      --circle-border: rgba(124, 58, 237, 0.2);
      --text: #6d28d9;
      --text-muted: #7c3aed;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(221, 214, 254, 0.9);
      --accent: #7c3aed;
    }

    [data-theme="pink"] {
      --bg-outer: #fbcfe8;
      --bg-inner: #fce7f3;
      --circle-glow: #fdf2f8;
      --circle-core: #ffffff;
      --circle-border: rgba(219, 39, 119, 0.2);
      --text: #be185d;
      --text-muted: #db2777;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(251, 207, 232, 0.9);
      --accent: #db2777;
    }

    [data-theme="grey"] {
      --bg-outer: #e2e8f0;
      --bg-inner: #f1f5f9;
      --circle-glow: #f8fafc;
      --circle-core: #ffffff;
      --circle-border: rgba(100, 116, 139, 0.25);
      --text: #334155;
      --text-muted: #64748b;
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: rgba(226, 232, 240, 0.9);
      --accent: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, var(--bg-inner) 0%, var(--bg-outer) 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.5rem;
      transition: background 0.4s ease, color 0.4s ease;
      overflow-x: hidden;
    }

    .container { width: 100%; max-width: 860px; position: relative; }

    /* Top Bar */
    .top-bar { display: flex; justify-content: flex-end; width: 100%; margin-bottom: 1rem; position: relative; }

    .settings-btn {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.5rem 1.1rem;
      border-radius: 9999px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }
    .settings-btn:hover { background: rgba(255, 255, 255, 0.9); }

    .settings-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 14px;
      padding: 0.8rem;
      width: 170px;
      z-index: 50;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    .settings-dropdown h4 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.6rem; color: var(--text-muted); }
    .theme-option {
      padding: 0.45rem 0.6rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-transform: capitalize;
    }
    .theme-option:hover { background: rgba(0, 0, 0, 0.05); }
    .color-dot { width: 13px; height: 13px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); }

    /* Centered Header */
    header { text-align: center; margin: 2rem 0 4rem; }
    .title-logo {
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 2px 15px rgba(255, 255, 255, 0.8);
    }

    /* Circles Center Display */
    .home-grid {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4rem;
      margin-top: 1rem;
    }

    .circle-portal {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      /* Lighter, glowing monochromatic core */
      background: radial-gradient(circle at center, var(--circle-core) 0%, var(--circle-glow) 60%, var(--bg-inner) 100%);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04), 0 0 40px rgba(255, 255, 255, 0.9), inset 0 0 20px rgba(255, 255, 255, 0.8);
      border: 2px solid var(--circle-border);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
      text-align: center;
      user-select: none;
    }

    .circle-portal:hover {
      transform: scale(1.06);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.06), 0 0 60px rgba(255, 255, 255, 1), inset 0 0 30px rgba(255, 255, 255, 0.9);
    }

    .circle-portal h2 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--text);
      text-shadow: 0 1px 8px rgba(255, 255, 255, 0.8);
      pointer-events: none;
    }

    /* Stacks Dropdown attached to the left circle */
    .stacks-menu {
      display: none;
      position: absolute;
      top: calc(100% + 15px);
      width: 260px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 14px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
      z-index: 40;
      max-height: 250px;
      overflow-y: auto;
      text-align: left;
    }
    .dropdown-item { padding: 0.75rem 1rem; cursor: pointer; border-bottom: 1px solid rgba(0, 0, 0, 0.05); font-size: 0.9rem; font-weight: 600; color: var(--text); }
    .dropdown-item:hover { background: rgba(0, 0, 0, 0.04); }
    .dropdown-add { padding: 0.6rem 0.8rem; display: flex; gap: 0.4rem; background: rgba(255, 255, 255, 0.7); border-radius: 0 0 14px 14px; }

    /* Glass Panels */
    .view-panel {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 2.2rem;
      box-shadow: 0 15px 40px rgba(0,0,0,0.05);
      margin-top: 1rem;
    }

    .back-btn {
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      font-size: 0.9rem; font-weight: 600; margin-bottom: 1.5rem; display: inline-flex; align-items: center; gap: 0.4rem;
    }
    .back-btn:hover { color: var(--text); }

    form { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .full-width { grid-column: 1 / -1; }
    input, select, button {
      padding: 0.8rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      font-size: 0.95rem;
      outline: none;
      background: var(--input-bg);
      color: var(--text);
    }
    input::placeholder { color: var(--text-muted); opacity: 0.7; }
    button.primary {
      background: var(--accent);
      color: #ffffff;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.primary:hover { opacity: 0.9; }

    /* Task Card Item */
    .task-card {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.1rem 1.3rem;
      margin-bottom: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .meta { display: flex; gap: 0.6rem; font-size: 0.82rem; color: var(--text-muted); margin-top: 0.35rem; align-items: center; }
    .tag { background: rgba(255, 255, 255, 0.9); border: 1px solid var(--card-border); padding: 0.2rem 0.6rem; border-radius: 6px; font-weight: 600; color: var(--text); }
    .badge { font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 9999px; font-weight: 600; }
    .badge.not_started { background: #f1f5f9; color: #475569; }
    .badge.done { background: #dcfce7; color: #15803d; }
    .actions button { cursor: pointer; border: 1px solid var(--card-border); background: white; border-radius: 8px; padding: 0.35rem 0.65rem; }

    @media (max-width: 650px) {
      .home-grid { flex-direction: column; gap: 2.5rem; }
      .circle-portal { width: 210px; height: 210px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Top Bar with Settings Dropdown -->
    <div class="top-bar">
      <button class="settings-btn" onclick="toggleSettings(event)">&#9881; Settings</button>
      <div class="settings-dropdown" id="settingsDropdown">
        <h4>Color Theme</h4>
        <div class="theme-option" onclick="applyTheme('blue')"><span class="color-dot" style="background: #bae6fd;"></span> Blue</div>
        <div class="theme-option" onclick="applyTheme('red')"><span class="color-dot" style="background: #fecdd3;"></span> Red</div>
        <div class="theme-option" onclick="applyTheme('orange')"><span class="color-dot" style="background: #fed7aa;"></span> Orange</div>
        <div class="theme-option" onclick="applyTheme('yellow')"><span class="color-dot" style="background: #fef08a;"></span> Yellow</div>
        <div class="theme-option" onclick="applyTheme('green')"><span class="color-dot" style="background: #bbf7d0;"></span> Green</div>
        <div class="theme-option" onclick="applyTheme('indigo')"><span class="color-dot" style="background: #c7d2fe;"></span> Indigo</div>
        <div class="theme-option" onclick="applyTheme('violet')"><span class="color-dot" style="background: #ddd6fe;"></span> Violet</div>
        <div class="theme-option" onclick="applyTheme('pink')"><span class="color-dot" style="background: #fbcfe8;"></span> Pink</div>
        <div class="theme-option" onclick="applyTheme('grey')"><span class="color-dot" style="background: #e2e8f0;"></span> Grey</div>
      </div>
    </div>

    <!-- Centered Header -->
    <header>
      <div class="title-logo">TASKSTACK</div>
    </header>

    <!-- Main Navigation Hub (Light Monochromatic Circles) -->
    <div class="home-grid" id="homeView">
      <!-- Left Circle: My Stacks -->
      <div class="circle-portal" id="myStacksCircle" onclick="toggleStacks(event)">
        <h2>MY STACKS</h2>
        <div class="stacks-menu" id="stacksDropdown">
          <div class="dropdown-item" onclick="openStackView('All')">All Tasks</div>
          <div id="dynamicStacks"></div>
          <div class="dropdown-add" onclick="event.stopPropagation()">
            <input type="text" id="newStackInput" placeholder="New stack..." style="padding: 0.4rem; font-size: 0.85rem;" />
            <button class="primary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;" onclick="createStack()">Add</button>
          </div>
        </div>
      </div>

      <!-- Right Circle: Create Task -->
      <div class="circle-portal" onclick="showCreateTaskView()">
        <h2>CREATE TASK</h2>
      </div>
    </div>

    <!-- Create Task View -->
    <div class="view-panel" id="createView">
      <button class="back-btn" onclick="showHomeView()">&larr; Back to Menu</button>
      <h3 style="margin-bottom: 1.5rem;">Create New Task</h3>
      <form id="createTaskForm">
        <input type="text" id="title" class="full-width" placeholder="Task Name" required />
        <input type="text" id="course" placeholder="Tag / Context (e.g. CS101, Chores)" required />
        
        <select id="stackSelect" required></select>

        <input type="date" id="due_date" required />
        <input type="time" id="due_time" value="23:59" />
        <input type="url" id="link" class="full-width" placeholder="Link (optional)" />
        
        <button type="submit" class="primary full-width">Add Task to Stack</button>
      </form>
    </div>

    <!-- Task List View -->
    <div class="view-panel" id="listView">
      <button class="back-btn" onclick="showHomeView()">&larr; Back to Menu</button>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h3 id="currentStackHeading">All Tasks</h3>
        <button class="primary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;" onclick="showCreateTaskView()">+ New Task</button>
      </div>
      <div id="tasksContainer"></div>
    </div>
  </div>

  <script>
    let stacks = [];
    let activeStack = 'All';

    // Theme Management
    function applyTheme(name) {
      if (name === 'blue') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', name);
      }
      localStorage.setItem('taskstack-theme', name);
      document.getElementById('settingsDropdown').style.display = 'none';
    }

    const savedTheme = localStorage.getItem('taskstack-theme') || 'blue';
    applyTheme(savedTheme);

    function toggleSettings(e) {
      e.stopPropagation();
      const menu = document.getElementById('settingsDropdown');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
      document.getElementById('stacksDropdown').style.display = 'none';
    }

    function toggleStacks(e) {
      e.stopPropagation();
      const menu = document.getElementById('stacksDropdown');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
      document.getElementById('settingsDropdown').style.display = 'none';
    }

    window.onclick = () => {
      document.getElementById('settingsDropdown').style.display = 'none';
      document.getElementById('stacksDropdown').style.display = 'none';
    };

    // Stacks API Integration
    async function loadStacks() {
      const res = await fetch('/stacks');
      stacks = await res.json();
      
      const dynamicList = document.getElementById('dynamicStacks');
      dynamicList.innerHTML = stacks.map(s => `
        <div class="dropdown-item" onclick="openStackView('${s.name}')">${s.name}</div>
      `).join('');

      const select = document.getElementById('stackSelect');
      if (stacks.length === 0) {
        select.innerHTML = `<option value="General">General</option>`;
      } else {
        select.innerHTML = stacks.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
      }
    }

    async function createStack() {
      const input = document.getElementById('newStackInput');
      const name = input.value.trim();
      if (!name) return;

      const res = await fetch('/stacks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });

      if (res.ok) {
        input.value = '';
        await loadStacks();
        openStackView(name);
      } else {
        const err = await res.json();
        alert(err.detail || 'Could not create stack');
      }
    }

    // View Navigation
    function showHomeView() {
      document.getElementById('homeView').style.display = 'flex';
      document.getElementById('createView').style.display = 'none';
      document.getElementById('listView').style.display = 'none';
    }

    function showCreateTaskView() {
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('createView').style.display = 'block';
      document.getElementById('listView').style.display = 'none';
      if (activeStack !== 'All') {
        document.getElementById('stackSelect').value = activeStack;
      }
    }

    async function openStackView(stackName) {
      activeStack = stackName;
      document.getElementById('currentStackHeading').innerText = stackName === 'All' ? 'All Tasks' : stackName;
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('createView').style.display = 'none';
      document.getElementById('listView').style.display = 'block';
      
      await fetchAssignments();
    }

    async function fetchAssignments() {
      let url = new URL('/assignments', window.location.origin);
      if (activeStack !== 'All') {
        url.searchParams.append('stack', activeStack);
      }

      const res = await fetch(url);
      const tasks = await res.json();
      const container = document.getElementById('tasksContainer');

      if (tasks.length === 0) {
        container.innerHTML = `<p style="color: var(--text-muted); text-align: center; margin: 2rem 0;">No tasks found in this stack.</p>`;
        return;
      }

      container.innerHTML = tasks.map(t => `
        <div class="task-card">
          <div>
            <div style="font-weight: 600; color: var(--text); ${t.status === 'done' ? 'text-decoration: line-through; opacity: 0.5;' : ''}">${t.title}</div>
            <div class="meta">
              <span class="tag">${t.stack_name}</span>
              <span class="tag">${t.course}</span>
              <span>Due: ${t.due_date} ${t.due_time || ''}</span>
              ${t.link ? `<a href="${t.link}" target="_blank" style="color: var(--accent); font-weight: 600;">Link</a>` : ''}
              <span class="badge ${t.status}">${t.status.replace('_', ' ')}</span>
            </div>
          </div>
          <div class="actions">
            ${t.status !== 'done' ? `<button onclick="updateStatus(${t.id}, 'done')">&#10003;</button>` : ''}
            <button onclick="deleteTask(${t.id})" style="color: #ef4444;">&times;</button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('createTaskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        title: document.getElementById('title').value,
        course: document.getElementById('course').value,
        stack_name: document.getElementById('stackSelect').value,
        due_date: document.getElementById('due_date').value,
        due_time: document.getElementById('due_time').value || null,
        link: document.getElementById('link').value || null,
        status: 'not_started'
      };

      await fetch('/assignments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      e.target.reset();
      openStackView(payload.stack_name);
    });

    async function updateStatus(id, nextStatus) {
      await fetch(`/assignments/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: nextStatus })
      });
      fetchAssignments();
    }

    async function deleteTask(id) {
      if (confirm('Delete this task?')) {
        await fetch(`/assignments/${id}`, { method: 'DELETE' });
        fetchAssignments();
      }
    }

    // Initial load
    loadStacks();
  </script>
</body>
</html>
