<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskStack</title>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --text: #0f172a;
      --muted: #64748b; --border: #e2e8f0; --accent: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 3rem 1.5rem; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 760px; }

    /* Centered Header */
    header { text-align: center; margin-bottom: 3.5rem; }
    .title-logo { font-size: 2.4rem; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; }

    /* Home Navigation Boxes */
    .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
    .nav-box {
      background: var(--card); border: 2px solid var(--border); border-radius: 16px;
      padding: 2.5rem 1.5rem; text-align: center; cursor: pointer; transition: all 0.2s ease;
      position: relative; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
    }
    .nav-box:hover { border-color: var(--accent); transform: translateY(-2px); }
    .nav-box h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.05em; }

    /* Dropdown inside My Stacks */
    .dropdown-menu {
      display: none; position: absolute; top: calc(100% + 8px); left: 0; right: 0;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 20; max-height: 260px; overflow-y: auto; text-align: left;
    }
    .dropdown-item { padding: 0.75rem 1.2rem; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-weight: 500; }
    .dropdown-item:hover { background: #f8fafc; color: var(--accent); }
    .dropdown-add { padding: 0.75rem 1.2rem; display: flex; gap: 0.5rem; background: #fafafa; border-radius: 0 0 12px 12px; }

    /* Panels (Create Task / Task List) */
    .view-panel { display: none; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; }
    .back-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem; margin-bottom: 1.5rem; display: inline-flex; align-items: center; gap: 0.3rem; }
    .back-btn:hover { color: var(--text); }

    /* Forms */
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .full-width { grid-column: 1 / -1; }
    input, select, button { padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border); font-size: 0.95rem; outline: none; }
    button.primary { background: var(--accent); color: white; border: none; font-weight: 600; cursor: pointer; }

    /* Assignment Items */
    .task-card {
      background: #fdfdfd; border: 1px solid var(--border); border-radius: 10px;
      padding: 1rem 1.25rem; margin-bottom: 0.75rem; display: flex;
      justify-content: space-between; align-items: center;
    }
    .meta { display: flex; gap: 0.5rem; font-size: 0.8rem; color: var(--muted); margin-top: 0.3rem; align-items: center; }
    .tag { background: #f1f5f9; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 600; }
    .badge { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 9999px; font-weight: 600; }
    .badge.not_started { background: #f1f5f9; color: #475569; }
    .badge.done { background: #dcfce7; color: #15803d; }
    .actions button { cursor: pointer; border: 1px solid var(--border); background: white; border-radius: 6px; padding: 0.3rem 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-logo">TASKSTACK</div>
    </header>

    <!-- Default Landing Options -->
    <div class="home-grid" id="homeView">
      <div class="nav-box" id="myStacksBtn" onclick="toggleDropdown(event)">
        <h2>MY STACKS</h2>
        <div class="dropdown-menu" id="stacksDropdown">
          <div class="dropdown-item" onclick="openStackView('All')">All Tasks</div>
          <div id="dynamicStacks"></div>
          <div class="dropdown-add" onclick="event.stopPropagation()">
            <input type="text" id="newStackInput" placeholder="New stack..." style="padding: 0.4rem; font-size: 0.85rem;" />
            <button class="primary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;" onclick="createStack()">Add</button>
          </div>
        </div>
      </div>

      <div class="nav-box" onclick="showCreateTaskView()">
        <h2>CREATE TASK</h2>
      </div>
    </div>

    <!-- Create Task View -->
    <div class="view-panel" id="createView">
      <button class="back-btn" onclick="showHomeView()">&larr; Back to Menu</button>
      <h3 style="margin-bottom: 1.5rem;">Create New Task</h3>
      <form id="createTaskForm">
        <input type="text" id="title" class="full-width" placeholder="Task Name" required />
        <input type="text" id="course" placeholder="Tag / Context (e.g. CS101, Chores)" required />
        
        <select id="stackSelect" required>
          <!-- Populated from DB -->
        </select>

        <input type="date" id="due_date" required />
        <input type="time" id="due_time" value="23:59" />
        <input type="url" id="link" class="full-width" placeholder="Link (optional)" />
        
        <button type="submit" class="primary full-width">Add Task to Stack</button>
      </form>
    </div>

    <!-- Task List View -->
    <div class="view-panel" id="listView">
      <button class="back-btn" onclick="showHomeView()">&larr; Back to Menu</button>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h3 id="currentStackHeading">All Tasks</h3>
        <button class="primary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;" onclick="showCreateTaskView()">+ New Task</button>
      </div>
      <div id="tasksContainer"></div>
    </div>
  </div>

  <script>
    let stacks = [];
    let activeStack = 'All';

    async function loadStacks() {
      const res = await fetch('/stacks');
      stacks = await res.json();
      
      // Update dropdown list
      const dynamicList = document.getElementById('dynamicStacks');
      dynamicList.innerHTML = stacks.map(s => `
        <div class="dropdown-item" onclick="openStackView('${s.name}')">${s.name}</div>
      `).join('');

      // Update stack select options in Create Task form
      const select = document.getElementById('stackSelect');
      if (stacks.length === 0) {
        select.innerHTML = `<option value="General">General</option>`;
      } else {
        select.innerHTML = stacks.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
      }
    }

    function toggleDropdown(e) {
      e.stopPropagation();
      const dd = document.getElementById('stacksDropdown');
      dd.style.display = dd.style.display === 'block' ? 'none' : 'block';
    }

    window.onclick = () => {
      document.getElementById('stacksDropdown').style.display = 'none';
    };

    async function createStack() {
      const input = document.getElementById('newStackInput');
      const name = input.value.trim();
      if (!name) return;

      const res = await fetch('/stacks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });

      if (res.ok) {
        input.value = '';
        await loadStacks();
        openStackView(name);
      } else {
        const err = await res.json();
        alert(err.detail || 'Could not create stack');
      }
    }

    function showHomeView() {
      document.getElementById('homeView').style.display = 'grid';
      document.getElementById('createView').style.display = 'none';
      document.getElementById('listView').style.display = 'none';
    }

    function showCreateTaskView() {
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('createView').style.display = 'block';
      document.getElementById('listView').style.display = 'none';
      if (activeStack !== 'All') {
        document.getElementById('stackSelect').value = activeStack;
      }
    }

    async function openStackView(stackName) {
      activeStack = stackName;
      document.getElementById('currentStackHeading').innerText = stackName === 'All' ? 'All Tasks' : stackName;
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('createView').style.display = 'none';
      document.getElementById('listView').style.display = 'block';
      
      await fetchAssignments();
    }

    async function fetchAssignments() {
      let url = new URL('/assignments', window.location.origin);
      if (activeStack !== 'All') {
        url.searchParams.append('stack', activeStack);
      }

      const res = await fetch(url);
      const tasks = await res.json();
      const container = document.getElementById('tasksContainer');

      if (tasks.length === 0) {
        container.innerHTML = `<p style="color: var(--muted); text-align: center; margin: 2rem 0;">No tasks found in this stack.</p>`;
        return;
      }

      container.innerHTML = tasks.map(t => `
        <div class="task-card">
          <div>
            <div style="font-weight: 600; ${t.status === 'done' ? 'text-decoration: line-through; opacity: 0.6;' : ''}">${t.title}</div>
            <div class="meta">
              <span class="tag">${t.stack_name}</span>
              <span class="tag">${t.course}</span>
              <span>Due: ${t.due_date} ${t.due_time || ''}</span>
              ${t.link ? `<a href="${t.link}" target="_blank" style="color: var(--accent);">Link</a>` : ''}
              <span class="badge ${t.status}">${t.status.replace('_', ' ')}</span>
            </div>
          </div>
          <div class="actions">
            ${t.status !== 'done' ? `<button onclick="updateStatus(${t.id}, 'done')">&#10003;</button>` : ''}
            <button onclick="deleteTask(${t.id})" style="color: #ef4444;">&times;</button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('createTaskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        title: document.getElementById('title').value,
        course: document.getElementById('course').value,
        stack_name: document.getElementById('stackSelect').value,
        due_date: document.getElementById('due_date').value,
        due_time: document.getElementById('due_time').value || null,
        link: document.getElementById('link').value || null,
        status: 'not_started'
      };

      await fetch('/assignments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      e.target.reset();
      openStackView(payload.stack_name);
    });

    async function updateStatus(id, nextStatus) {
      await fetch(`/assignments/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: nextStatus })
      });
      fetchAssignments();
    }

    async function deleteTask(id) {
      if (confirm('Delete this task?')) {
        await fetch(`/assignments/${id}`, { method: 'DELETE' });
        fetchAssignments();
      }
    }

    // Initialize
    loadStacks();
  </script>
</body>
</html>
